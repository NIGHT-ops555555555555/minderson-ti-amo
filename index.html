<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo do Sorteio Invertido</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>Jogo do Sorteio</h1>
        
        <div class="score-board">
            Pontuação de Acertos: <span id="score">0</span>
        </div>

        <p class="question">Qual é o número sorteado de 1 a 10?</p>

        <div class="input-group">
            <input type="number" id="userGuess" min="1" max="10" placeholder="Digite de 1 a 10">
            <button id="btnChutar" onclick="jogar()">Chutar</button>
        </div>

        <div id="result" class="result-message"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
